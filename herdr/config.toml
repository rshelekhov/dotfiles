onboarding = false

[theme]
name = "terminal"   # colors come from the Ghostty theme (Ayu)

[theme.custom]
sidebar_bg = "#11151C"   # slightly lighter than the Ayu background #0B0E14, so the sidebar stands apart from the panes
accent     = "#E6B450"   # Ayu signature yellow
active_row_bg = "#1C212B"  # active space/agent row: same hue as the sidebar #11151C, one step lighter
selection_bg  = "#1C212B"
panel_bg      = "#131721"  # pane area and tab bar background, slightly lighter than the Ayu background

[ui]
# Wider sidebar (defaults: 26 / 18 / 36)
sidebar_width = 36
sidebar_min_width = 32
sidebar_max_width = 48
# Claude limits as one line right of the tabs (instead of repeating them on every agent)
tab_bar_right = [
  { type = "command", command = "~/.config/herdr/claude-usage.sh", interval_seconds = 30, timeout_seconds = 3 },
]
agent_panel_sort = "spaces" # herdr-agent-usage
# Sidebar as on herdr.dev: status dots, name + caption, blank row between entries

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", "workspace"], ["state_text", "agent"]]

[ui.sidebar.agents.rows_by_agent]
claude = [[{ token = "$quota_group", bold = true, dim = false }], ["state_text"], [{ token = "tab", bold = false, dim = true }, { token = "terminal_title_stripped", fg = "#BFBDB6", bold = false, dim = false }], [{ token = "$quota_icon", fg = "#BFBDB6", bold = false, dim = false, rules = [{ contains = "⁠", fg = "#95E6CB" }, { contains = "⁡", fg = "#E6B450" }, { contains = "⁢", fg = "#F07178" }] }, { token = "$quota_provider_model", fg = "#8A8F98", bold = false, dim = false }, { token = "$quota_member", fg = "#8A8F98", bold = false, dim = false }], [{ token = "$quota_model", fg = "#8A8F98", bold = false, dim = false }], [{ token = "$quota_error", fg = "#FFB454", bold = false, dim = false }], [{ token = "$quota_context_normal", fg = "#565B66", bold = false, dim = false }, { token = "$quota_context_warning", fg = "#FFB454", bold = false, dim = false }, { token = "$quota_context_danger", fg = "#F07178", bold = false, dim = false }], [{ token = "$quota_nest_gap", bold = false, dim = false }]] # custom layout (no plugin marker, so `configure` will not overwrite it)
codex = [[{ token = "$quota_group", bold = true, dim = false }], ["state_text", "agent"], [{ token = "$quota_icon", fg = "#e9e9f0", bold = false, dim = false, rules = [{ contains = "⁠", fg = "#94e2d5" }, { contains = "⁡", fg = "#f9e2af" }, { contains = "⁢", fg = "#f38ba8" }] }, { token = "$quota_provider_model", fg = "#e9e9f0", bold = true, dim = false }, { token = "$quota_member", fg = "#e9e9f0", bold = false, dim = false }], [{ token = "$quota_model", fg = "#e9e9f0", bold = false, dim = false }], [{ token = "tab", bold = false, dim = true }, { token = "terminal_title_stripped", bold = false, dim = false }], [{ token = "$quota_error", fg = "#e4b957", bold = false, dim = false }], [{ token = "$quota_context_normal", fg = "#98b17d", bold = false, dim = false }, { token = "$quota_context_warning", fg = "#dec27f", bold = false, dim = false }, { token = "$quota_context_danger", fg = "#df919b", bold = false, dim = false }], [{ token = "$quota_nest_gap", bold = false, dim = false }]] # herdr-agent-usage-provider
opencode = [[{ token = "$quota_group", bold = true, dim = false }], ["state_text", "agent"], [{ token = "$quota_icon", fg = "#e9e9f0", bold = false, dim = false, rules = [{ contains = "⁠", fg = "#94e2d5" }, { contains = "⁡", fg = "#f9e2af" }, { contains = "⁢", fg = "#f38ba8" }] }, { token = "$quota_provider_model", fg = "#e9e9f0", bold = true, dim = false }, { token = "$quota_member", fg = "#e9e9f0", bold = false, dim = false }], [{ token = "$quota_model", fg = "#e9e9f0", bold = false, dim = false }], [{ token = "tab", bold = false, dim = true }, { token = "terminal_title_stripped", bold = false, dim = false }], [{ token = "$quota_error", fg = "#e4b957", bold = false, dim = false }], [{ token = "$quota_context_normal", fg = "#98b17d", bold = false, dim = false }, { token = "$quota_context_warning", fg = "#dec27f", bold = false, dim = false }, { token = "$quota_context_danger", fg = "#df919b", bold = false, dim = false }], [{ token = "$quota_nest_gap", bold = false, dim = false }]] # herdr-agent-usage-provider

# macOS notification (via terminal-notifier) when an agent finishes or waits for input
[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[keys]
# The ctrl+b prefix and all prefix bindings stay.
# Direct chords use ctrl+shift+…: Ghostty does not claim them, and Option is not needed.
next_agent = ["prefix+a", "ctrl+shift+n"]
previous_agent = ["prefix+shift+a", "ctrl+shift+p"]
open_notification_target = ["prefix+o", "ctrl+shift+o"]
switch_workspace = ["prefix+shift+1..9", "ctrl+shift+1..9"]
next_workspace = ["prefix+period", "ctrl+shift+j"]
previous_workspace = ["prefix+comma", "ctrl+shift+k"]
goto = ["prefix+g", "ctrl+shift+g"]
toggle_sidebar = ["prefix+b", "ctrl+shift+b"]
# Remove the current workspace worktree (built-in: asks to confirm, keeps the branch)
remove_worktree = ["prefix+shift+u", "ctrl+shift+x"]

# Linear → worktree + claude (rs.linear-kickoff plugin)
[[keys.command]]
key = "ctrl+shift+l"
type = "plugin_action"
command = "rs.linear-kickoff.open"
description = "Linear: задачи"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "rs.linear-kickoff.open"
description = "Linear: задачи"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+semicolon"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "jump back to previous workspace"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-navigator.open-side"
description = "navigator in side pane"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "herdr-agent-usage.refresh"
description = "refresh all agent quotas"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "herdr-agent-usage.open-settings"
description = "open agent quota settings"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "herdr-agent-usage.toggle-agent-order"
description = "toggle agent order: quota / tabs"
